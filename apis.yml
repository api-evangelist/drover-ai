aid: drover-ai
name: Drover AI
description: >-
  Drover AI is a Los Angeles-based micromobility technology company that pioneers the use of
  computer vision, machine learning, and proprietary sensor fusion in shared light electric
  vehicles (LEVs) such as e-scooters and e-bikes. Its flagship PathPilot module is a plug-and-play
  IoT unit retrofit onto existing fleet vehicles that delivers granular infrastructure distinction
  (sidewalk, bike lane, crosswalk, street), real-time parking validation, and the ability to control
  vehicle behavior (speed reduction, throttle disable) based on rider location. The Drover Corral
  dashboard surfaces real-time compliance insights and validation to operators and cities in line with
  the MDS 2.0 standard, delivered via API and automated Slack alerts. Partners and customers include
  Spin, Voi, Bolt, Beam, Dott, and Felyx. Drover AI is a portfolio company of 500 Global. No public
  developer portal, OpenAPI, or SDK surface is published; integration is handled directly with operators.
